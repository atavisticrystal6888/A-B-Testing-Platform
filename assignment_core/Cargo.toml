[package]
name = "assignment_core"
version = "0.1.0"
edition = "2021"
description = "Deterministic variant assignment library using MurmurHash3"

[lib]
name = "assignment_core"
# Order matters: Rustler copies the FIRST artifact cargo reports, so "cdylib"
# must stay ahead of "lib". With "lib" first it copies the .rlib (a static Rust
# archive) to priv/native/assignment_core.dll, the NIF fails to load, and the
# Elixir golden-vector test silently falls back to the pure-Elixir hash.
# Both artifacts are emitted either way; cargo test and the benches need the rlib.
crate-type = ["cdylib", "lib"]

[dependencies]
murmur3 = "0.5"
rustler = "0.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
proptest = "1.4"
criterion = "0.5"

[[bench]]
name = "assignment_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
