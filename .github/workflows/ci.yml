name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  elixir:
    name: Elixir umbrella
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6380
      ASSIGNMENT_ENGINE_BUILD_NIF: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "27"
      # The assignment_engine NIF (apps/assignment_engine/lib/assignment_engine/native.ex)
      # builds the Rust assignment_core crate when ASSIGNMENT_ENGINE_BUILD_NIF=1, so the
      # golden-vector parity test (native_test.exs) actually runs against the compiled
      # NIF here instead of silently falling back to the pure-Elixir implementation.
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            assignment_core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('assignment_core/Cargo.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix credo --strict

  rust:
    name: Rust assignment_core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignment_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            assignment_core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('assignment_core/Cargo.lock') }}
      - run: cargo build --all-targets
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo bench --no-run

  python:
    name: Python ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [statistical_engine, data_pipeline]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install .[dev]
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -q

  dashboard:
    name: React dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run typecheck:test
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  docker-builds:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [elixir, python, dashboard]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Build statistical-engine image
        run: docker build -f statistical_engine/Dockerfile .
      - name: Build data-pipeline image
        run: docker build -f data_pipeline/Dockerfile .
      - name: Build experiment-hub-web image
        run: docker build -f Dockerfile.experiment-hub-web .
      - name: Build dashboard image
        run: docker build -f dashboard/Dockerfile .

  release-smoke-test:
    name: Release stack smoke test
    runs-on: ubuntu-latest
    needs: [docker-builds]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      # Ephemeral, CI-only secrets — this stack is torn down at the end of
      # the job. Never reuse these values for a real deployment.
      - name: Generate ephemeral release.env
        run: |
          cat > release.env <<EOF
          PHX_HOST=localhost
          DATABASE_URL=ecto://experimenthub:experimenthub_dev@postgres/experiment_hub_dev
          SECRET_KEY_BASE=$(openssl rand -base64 64 | tr -d '\n')
          JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')
          REDIS_URL=redis://redis:6379
          STAT_ENGINE_URL=http://statistical-engine:8000
          STAT_ENGINE_API_KEY=$(openssl rand -hex 32)
          KAFKA_BROKERS=kafka:29092
          KAFKA_GROUP_ID=experimenthub-event-collector
          KAFKA_TOPICS=experimenthub.events.inbound
          KAFKA_CONSUMER_ENABLED=true
          PIPELINE_DATABASE_URL=postgresql://experimenthub:experimenthub_dev@postgres:5432/experiment_hub_dev
          KAFKA_EVENT_TOPIC=experimenthub.events.raw
          ROLLUP_FLUSH_MAX_EVENTS=500
          ROLLUP_FLUSH_INTERVAL_SECONDS=10
          POOL_SIZE=10
          DB_SSL=false
          DNS_CLUSTER_QUERY=
          POSTGRES_PORT=15432
          DASHBOARD_PORT=8080
          CORS_ORIGINS=http://localhost:8080
          DASHBOARD_APP_API_URL=
          DASHBOARD_VITE_API_URL=
          EOF

      - name: Build release images
        run: docker compose --env-file release.env -f docker-compose.yml -f docker-compose.release.yml build

      - name: Start infrastructure
        run: docker compose --env-file release.env -f docker-compose.yml -f docker-compose.release.yml up -d postgres kafka redis

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' experimenthub-postgres 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "::error::Postgres never became healthy" && exit 1

      - name: Run release migrations
        run: docker compose --env-file release.env -f docker-compose.yml -f docker-compose.release.yml --profile ops run --rm experiment-hub-migrate

      - name: Start full stack
        run: docker compose --env-file release.env -f docker-compose.yml -f docker-compose.release.yml up -d

      - name: Wait for dashboard health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health | grep -q '"status":"ok"'; then exit 0; fi
            sleep 2
          done
          echo "::error::Dashboard /health never returned ok" && exit 1

      - name: Dump container logs on failure
        if: failure()
        run: docker compose --env-file release.env -f docker-compose.yml -f docker-compose.release.yml logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose --env-file release.env -f docker-compose.yml -f docker-compose.release.yml down -v
