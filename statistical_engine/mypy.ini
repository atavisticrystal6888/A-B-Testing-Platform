[mypy]
python_version = 3.12
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# scipy ships no inline types and we don't vendor scipy-stubs; without this
# every `from scipy import stats` is an import-untyped error under strict.
[mypy-scipy.*]
ignore_missing_imports = True
